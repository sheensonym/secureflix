<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ movie.title }}</title>
    <style>
        body {
            background-color: #141414;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .movie-container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            background-color: #181818;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #e50914;
            text-align: center;
        }

        video {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 20px;
            outline: none;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #ccc;
            text-align: justify;
        }

        /* Netflix-style hover effect for video */
        video:hover {
            box-shadow: 0 0 20px rgba(229,9,20,0.7);
            transition: box-shadow 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="movie-container">
        <h1>{{ movie.title }}</h1>
        <video controls>
            <source src="{{ movie.video.url }}" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <p>{{ movie.description }}</p>
    </div>
</body>
</html>
